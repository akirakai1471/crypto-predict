[project]
name = "cryptopred"
version = "0.1.0"
description = "Crypto price direction prediction system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# Only the question-answering layer needs this. briefing/ must keep working
# for anyone who never installs it.
ask = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
cryptopred-ingest = "cryptopred.ingest.cli:app"
cryptopred-dataset = "cryptopred.dataset.cli:app"
cryptopred-model = "cryptopred.models.cli:app"
cryptopred-serve = "cryptopred.serve.cli:app"
cryptopred-paper = "cryptopred.paper.cli:app"
cryptopred-meta = "cryptopred.models.meta_cli:app"
cryptopred-brief = "cryptopred.briefing.cli:app"
cryptopred-ask = "cryptopred.ask.cli:app"
cryptopred-news = "cryptopred.news.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptopred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: test performs real network calls (deselect with '-m \"not network\"')",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in an argument default is the framework's documented idiom
"src/cryptopred/**/*cli.py" = ["B008"]
